# Docker Compose for Distributed Agent Deployment
# This file deploys:
# - 1 Proxy/Dispatcher service
# - 2 Agent Service instances (Service A and Service B)
# - Each service has isolated PostgreSQL and Qdrant databases

services:
  # ===========================================
  # PROXY/DISPATCHER SERVICE
  # ===========================================
  proxy:
    build:
      context: .
      dockerfile: proxy_service/Dockerfile
    container_name: proxy
    ports:
      - "8000:8000"
    environment:
      - PROXY_HOST=0.0.0.0
      - PROXY_PORT=8000
      - SERVICE_TIMEOUT=90
      - HEARTBEAT_INTERVAL=30
      - LOG_LEVEL=INFO
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ===========================================
  # SERVICE A - Payment Service Agent Cluster
  # ===========================================
  service-a-postgres:
    image: postgres:15
    container_name: service-a-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: logs_user
      POSTGRES_PASSWORD: logs_pass
      POSTGRES_DB: service_a_logs
    volumes:
      - service-a-pg-data:/var/lib/postgresql/data
      - ./infra/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql:ro
      - ./infra/seed_service_a.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs_user -d service_a_logs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  service-a-qdrant:
    image: qdrant/qdrant:latest
    container_name: service-a-qdrant
    ports:
      - "6333:6333"
    volumes:
      - service-a-qdrant-data:/qdrant/storage
    networks:
      - agent-network
    restart: unless-stopped

  service-a-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-a-api
    ports:
      - "8001:8000"
    env_file:
      - ./config/service-a.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      proxy:
        condition: service_healthy
      service-a-postgres:
        condition: service_healthy
      service-a-qdrant:
        condition: service_started
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ===========================================
  # SERVICE B - Order Service Agent Cluster
  # ===========================================
  service-b-postgres:
    image: postgres:15
    container_name: service-b-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: logs_user
      POSTGRES_PASSWORD: logs_pass
      POSTGRES_DB: service_b_logs
    volumes:
      - service-b-pg-data:/var/lib/postgresql/data
      - ./infra/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql:ro
      - ./infra/seed_service_b.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs_user -d service_b_logs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  service-b-qdrant:
    image: qdrant/qdrant:latest
    container_name: service-b-qdrant
    ports:
      - "6334:6333"
    volumes:
      - service-b-qdrant-data:/qdrant/storage
    networks:
      - agent-network
    restart: unless-stopped

  service-b-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-b-api
    ports:
      - "8002:8000"
    env_file:
      - ./config/service-b.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      proxy:
        condition: service_healthy
      service-b-postgres:
        condition: service_healthy
      service-b-qdrant:
        condition: service_started
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

# ===========================================
# NETWORKS
# ===========================================
networks:
  agent-network:
    driver: bridge
    name: agent-distributed-network

# ===========================================
# VOLUMES
# ===========================================
volumes:
  service-a-pg-data:
    name: service-a-pg-data
  service-a-qdrant-data:
    name: service-a-qdrant-data
  service-b-pg-data:
    name: service-b-pg-data
  service-b-qdrant-data:
    name: service-b-qdrant-data

