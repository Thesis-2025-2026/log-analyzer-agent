# Docker Compose for Distributed Agent Deployment
# This file deploys:
# - 1 Proxy/Dispatcher service
# - 2 Agent Service instances (Service A and Service B)
# - Each service has isolated PostgreSQL and Qdrant databases

services:
  # ===========================================
  # REDIS (shared for detectors/log ingestion)
  # ===========================================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - agent-network
    restart: unless-stopped

  # ===========================================
  # PROXY/DISPATCHER SERVICE
  # ===========================================
  proxy-trace-postgres:
    image: postgres:15
    container_name: proxy-trace-postgres
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: trace_user
      POSTGRES_PASSWORD: trace_pass
      POSTGRES_DB: proxy_traces
    volumes:
      - proxy-trace-pg-data:/var/lib/postgresql/data
      - ./infra/init_proxy_trace_db.sql:/docker-entrypoint-initdb.d/01_init_proxy_trace_db.sql:ro
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace_user -d proxy_traces"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: proxy_service/Dockerfile
    container_name: proxy
    ports:
      - "8000:8000"
    environment:
      - PROXY_HOST=0.0.0.0
      - PROXY_PORT=8000
      - SERVICE_TIMEOUT=90
      - HEARTBEAT_INTERVAL=30
      - LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PROXY_TRACE_DATABASE_URL=postgresql://trace_user:trace_pass@proxy-trace-postgres:5432/proxy_traces
    networks:
      - agent-network
    depends_on:
      proxy-trace-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ===========================================
  # SERVICE PAYMENT - Payment Service Agent Cluster
  # ===========================================
  service-payment-postgres:
    image: postgres:15
    container_name: service-payment-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: logs_user
      POSTGRES_PASSWORD: logs_pass
      POSTGRES_DB: payment_logs
    volumes:
      - service-payment-pg-data:/var/lib/postgresql/data
      - ./infra/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql:ro
      - ./infra/seed_payment.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs_user -d payment_logs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  service-payment-qdrant:
    image: qdrant/qdrant:latest
    container_name: service-payment-qdrant
    ports:
      - "6333:6333"
    volumes:
      - service-payment-qdrant-data:/qdrant/storage
    networks:
      - agent-network
    restart: unless-stopped

  service-payment-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-payment-api
    ports:
      - "8001:8000"
    env_file:
      - ./config/service-payment.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      proxy:
        condition: service_healthy
      service-payment-postgres:
        condition: service_healthy
      service-payment-qdrant:
        condition: service_started
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  service-payment-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-payment-detector
    command: ["python", "-m", "detector.detector"]
    env_file:
      - ./config/service-payment.env
    environment:
      - REDIS_HOST=redis
      - LOGS_CHANNEL=logs:payment
      - ANOM_CHANNEL=anomalies:payment
    depends_on:
      redis:
        condition: service_started
      service-payment-postgres:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

  service-payment-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-payment-consumer
    command: ["python", "-m", "agent_system.connect_to_detector"]
    env_file:
      - ./config/service-payment.env
    environment:
      - REDIS_HOST=redis
      - ANOM_CHANNEL=anomalies:payment
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_PROJECT=${OPENAI_PROJECT}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID}
    depends_on:
      redis:
        condition: service_started
      service-payment-postgres:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

