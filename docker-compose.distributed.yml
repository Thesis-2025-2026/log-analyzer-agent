      - agent-network
    restart: unless-stopped

# ===========================================
# NETWORKS
# ===========================================
networks:
  agent-network:
    driver: bridge
    name: agent-distributed-network

# ===========================================
# VOLUMES
# ===========================================
volumes:
  service-payment-pg-data:
    name: service-payment-pg-data
  service-payment-qdrant-data:
    name: service-payment-qdrant-data
  service-order-pg-data:
    name: service-order-pg-data
  service-order-qdrant-data:
    name: service-order-qdrant-data
  service-auth-pg-data:
    name: service-auth-pg-data
  service-auth-qdrant-data:
    name: service-auth-qdrant-data
  service-deployments-pg-data:
    name: service-deployments-pg-data
  service-deployments-qdrant-data:
    name: service-deployments-qdrant-data
  service-idp-pg-data:
    name: service-idp-pg-data
  service-idp-qdrant-data:
    name: service-idp-qdrant-data
  proxy-trace-pg-data:
    name: proxy-trace-pg-data
