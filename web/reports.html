<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reports (Mock List)</title>
  <link href="/assets/styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-100 text-gray-900">
  <div class="mx-auto grid max-w-6xl grid-cols-1 gap-6 p-6 md:grid-cols-[220px_1fr]">

    <!-- Sidebar navigation -->
    <aside class="rounded-2xl bg-white shadow-sm ring-1 ring-gray-200">
      <div class="border-b px-4 py-3">
        <h2 class="text-sm font-semibold text-gray-700">Navigation</h2>
      </div>
      <nav class="p-2 text-sm">
        <a href="/" class="block rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-50">Chat</a>
        <a href="#" class="mt-1 block rounded-lg bg-gray-900 px-3 py-2 font-medium text-white">Reports</a>
      </nav>
    </aside>

    <!-- Main list -->
    <main class="flex h-[85vh] flex-col rounded-2xl bg-white shadow-sm ring-1 ring-gray-200">
      <div class="flex items-center justify-between border-b px-4 py-3">
        <h1 class="text-sm font-semibold text-gray-800">Reports</h1>
        <div class="text-xs text-gray-500">Mock preview</div>
      </div>

      <div id="list" class="flex-1 divide-y overflow-y-auto"></div>

      <div class="border-t px-4 py-3 text-xs text-gray-500">End of list</div>
    </main>
  </div>

  <script>
    const listEl = document.getElementById('list');

    function itemBadge(level) {
      const map = {
        error: ['bg-red-100','text-red-700'],
        warn: ['bg-yellow-100','text-yellow-700'],
        warning: ['bg-yellow-100','text-yellow-700'],
        info: ['bg-emerald-100','text-emerald-700'],
        critical: ['bg-fuchsia-100','text-fuchsia-700'],
      };
      return map[(level||'').toLowerCase()] || ['bg-gray-100','text-gray-700'];
    }

    function dotColor(level) {
      const map = {
        error: 'bg-red-500',
        warn: 'bg-yellow-500',
        warning: 'bg-yellow-500',
        info: 'bg-emerald-500',
        critical: 'bg-fuchsia-500',
      };
      return map[(level||'').toLowerCase()] || 'bg-gray-400';
    }

    function renderReports(items) {
      listEl.innerHTML = '';
      if (!items.length) {
        listEl.innerHTML = '<div class="px-4 py-6 text-sm text-gray-500">No reports yet.</div>';
        return;
      }
      for (const r of items) {
        const [bg, fg] = itemBadge(r.level);
        const dot = dotColor(r.level);
        const el = document.createElement('article');
        el.className = 'group flex items-start gap-4 px-4 py-3 hover:bg-gray-50 cursor-pointer';
        el.innerHTML = `
          <div class="mt-1 h-2 w-2 shrink-0 rounded-full ${dot}"></div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <h2 class="truncate text-sm font-semibold text-gray-900">Report #${r.id} — ${r.service || 'unknown'}</h2>
              <span class="shrink-0 rounded-full ${bg} px-2 py-0.5 text-[11px] font-medium ${fg}">${r.level || 'unknown'}</span>
              <span class="ml-auto shrink-0 text-xs text-gray-500">${new Date(r.created_at).toLocaleString()}</span>
            </div>
            <p class="mt-1 line-clamp-2 text-sm leading-6 text-gray-600"></p>
          </div>`;
        el.querySelector('p').textContent = r.preview || '';
        el.addEventListener('click', () => {
          window.location.href = `/report/${r.id}`;
        });
        listEl.appendChild(el);
      }
    }

    async function loadReports() {
      try {
        const res = await fetch('/api/reports');
        const data = await res.json();
        if (res.ok) {
          renderReports(data.items || []);
        } else {
          listEl.innerHTML = `<div class="px-4 py-6 text-sm text-red-600">Failed to load reports: ${data.error || res.status}</div>`;
        }
      } catch (e) {
        listEl.innerHTML = '<div class="px-4 py-6 text-sm text-red-600">Network error loading reports.</div>';
      }
    }

    loadReports();
  </script>
</body>
</html>
