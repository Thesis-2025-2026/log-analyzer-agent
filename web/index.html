<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Chat</title>
  <link href="/assets/styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-100 text-gray-900">
  <div class="mx-auto grid max-w-6xl grid-cols-1 gap-6 p-6 md:grid-cols-[220px_1fr]">

    <!-- Sidebar navigation -->
    <aside class="rounded-2xl bg-white shadow-sm ring-1 ring-gray-200">
      <div class="border-b px-4 py-3">
        <h2 class="text-sm font-semibold text-gray-700">Navigation</h2>
      </div>
      <nav class="p-2 text-sm">
        <a href="/" class="block rounded-lg bg-gray-900 px-3 py-2 font-medium text-white">Chat</a>
        <a href="/reports" class="mt-1 block rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-50">Reports</a>
      </nav>
    </aside>

    <!-- Main chat panel -->
    <main class="flex h-[85vh] flex-col rounded-2xl bg-white shadow-sm ring-1 ring-gray-200">
      <!-- Header -->
      <div class="flex items-center justify-between border-b px-4 py-3">
        <h1 class="text-sm font-semibold text-gray-800">Chat with Agent</h1>
        <button id="newBtn" class="rounded-lg border border-gray-300 px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50">New chat</button>
      </div>

      <ul id="messages" class="flex-1 space-y-4 overflow-y-auto p-4 bg-gradient-to-b from-white to-gray-50"></ul>

      <div class="border-t p-3">
        <div class="flex items-start gap-2">
          <textarea id="input" rows="3" placeholder="Paste log or JSON… (Shift+Enter = newline)" class="h-24 w-full resize-none rounded-xl border border-gray-300 px-3 py-2 text-sm shadow-inner focus:border-gray-400 focus:outline-none"></textarea>
          <button id="sendBtn" class="h-10 shrink-0 rounded-xl bg-blue-600 px-4 text-sm font-medium text-white hover:bg-blue-700 disabled:opacity-50">Generate</button>
        </div>
        <p class="mt-2 text-xs text-gray-500">Enter to submit · Shift+Enter for newline</p>
      </div>
    </main>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const newBtn = document.getElementById('newBtn');

    function addBlock(roleLabel, color, text) {
      const li = document.createElement('li');
      li.className = 'rounded-xl border p-4 shadow-sm bg-white';
      li.style.borderLeftWidth = '4px';
      li.style.borderLeftColor = color;

      const label = document.createElement('div');
      label.className = 'mb-1 text-[11px] font-semibold uppercase tracking-wider';
      label.style.color = color;
      label.textContent = roleLabel;

      const body = document.createElement('div');
      body.className = 'whitespace-pre-wrap leading-6';
      body.textContent = text;

      li.appendChild(label);
      li.appendChild(body);
      messagesEl.appendChild(li);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addUser(text) { addBlock('User', '#2563eb', text); }
    function addReport(text) { addBlock('Report', '#059669', text); }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;

      addUser(text);
      // placeholder report while waiting
      const placeholder = document.createElement('li');
      placeholder.className = 'rounded-xl border p-4 shadow-sm bg-white';
      placeholder.style.borderLeftWidth = '4px';
      placeholder.style.borderLeftColor = '#a7f3d0';
      placeholder.innerHTML = `
        <div class="mb-1 text-[11px] font-semibold uppercase tracking-wider text-emerald-700">Report</div>
        <div class="whitespace-pre-wrap leading-6 text-gray-500">Generating report…</div>`;
      messagesEl.appendChild(placeholder);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: text, agent: 'log_analysis' })
        });
        const data = await res.json();
        messagesEl.removeChild(placeholder);
        if (res.ok) {
          const reportText = data.reply || 'Report generated.';
          addReport(reportText);
        } else {
          addReport(`[error] ${data.error || res.status}`);
        }
      } catch (e) {
        messagesEl.removeChild(placeholder);
        addReport('[network error]');
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // Keyboard UX
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener('click', send);
    newBtn.addEventListener('click', () => { messagesEl.innerHTML = ''; inputEl.focus(); });
  </script>
</body>
</html>
